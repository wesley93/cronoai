# Atualizações automáticas de dependências (semanais), agrupando minor/patch para reduzir ruído.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    ignore:
      # Majors que exigem migração (Tailwind 4, TypeScript 7, Vitest 5…) entram por PR planejado, não automático
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      producao-minor-patch:
        dependency-type: production
        update-types: [minor, patch]
      desenvolvimento-minor-patch:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(ci)"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    ignore:
      # Node acompanha o .nvmrc (LTS 22): troca de major é PR manual (Dockerfile + compose + .nvmrc + CI)
      - dependency-name: node
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(docker)"
