# CI: lint, tipos, testes com cobertura, build, auditoria, E2E (Playwright) e backend (.NET) em todo PR e na branch principal.
name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, tipos, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Node (versão do .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Testes e cobertura (mínimo de 80% em src/lib)
        run: npm run test:coverage

      - name: Build
        run: npx vite build

      - name: Auditoria das dependências de produção (bloqueia em alta/crítica)
        run: npm audit --omit=dev --audit-level=high

      - name: Publicar dist/ como artefato
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ github.sha }}
          path: dist
          retention-days: 7

  e2e:
    name: Testes E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Node (versão do .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund

      - name: Versão do Playwright
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      # Atenção: a documentação do Playwright não recomenda cache de navegadores (restaurar leva quase
      # o mesmo tempo que baixar): https://playwright.dev/docs/ci#caching-browsers
      # Medir no 1º PR (com e sem cache) e remover este passo se não houver ganho.
      - name: Cache do navegador
        id: cache-navegador
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Instalar Chromium e dependências do sistema
        if: steps.cache-navegador.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Instalar dependências do sistema (navegador em cache)
        if: steps.cache-navegador.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Testes E2E
        run: npm run e2e

      - name: Publicar relatório e traces (só na falha)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-${{ github.sha }}
          path: |
            playwright-report
            test-results
          retention-days: 7

  backend:
    # Nome usado na proteção da master: não renomear sem avisar. Sem filtro paths (check obrigatório pulado trava o merge).
    name: "Backend: build e testes (.NET)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: .NET (versão do global.json)
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: server/global.json
          cache: true
          cache-dependency-path: server/**/packages.lock.json

      - name: Restaurar pacotes (travado pelos lock files)
        run: dotnet restore CronoAI.slnx --locked-mode

      - name: Formatação
        run: dotnet format CronoAI.slnx --verify-no-changes --no-restore

      - name: Build (avisos são erros)
        run: dotnet build CronoAI.slnx --no-restore -c Release

      # Inclui os testes de integração: o runner traz Docker (Testcontainers, credenciais aleatórias, sem segredo).
      - name: Testes
        run: dotnet test --solution CronoAI.slnx --no-build -c Release --results-directory TestResults

      - name: Contrato OpenAPI versionado (o build regera; não pode haver diferença)
        run: git diff --exit-code -- openapi/

      - name: Modelo sem mudança pendente de migração
        # String fictícia e sem senha: o comando só constrói o modelo, não abre conexão.
        env:
          ConnectionStrings__CronoaiMigracao: "Host=localhost;Database=cronoai;Username=ef_design"
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes --project src/CronoAI.Dados --no-build --configuration Release

      - name: Publicar resultados dos testes (só na falha)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-testresults-${{ github.sha }}
          path: server/**/TestResults
          retention-days: 7

  audit-dev:
    name: Auditoria das dependências de desenvolvimento (informativa)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Node (versão do .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Relatório no resumo da execução
        run: |
          {
            echo "## npm audit (todas as dependências)"
            echo '```'
            npm audit --audit-level=high || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
