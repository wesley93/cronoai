# CodeQL (SAST) para JavaScript/TypeScript e C#.
# Em repositório privado exige GitHub Advanced Security/Code Security habilitado (ver docs/devops.md).
name: CodeQL

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: "23 6 * * 1" # segundas, 06:23 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Análise CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          # C# sem build: não depende do restore. Se a Segurança quiser mais precisão, trocar por "manual".
          - language: csharp
            build-mode: none
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      - name: Analisar
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
