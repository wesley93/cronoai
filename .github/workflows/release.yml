# Release: em tag vX.Y.Z (igual ao "version" do package.json), valida e publica o dist/ zipado no GitHub Releases.
# Dois jobs: o build roda npm com token só de leitura; a publicação tem escrita mas não executa código de dependências.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  build:
    name: Validar e empacotar
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Sem cache de npm: workflow de publicação não reaproveita cache de outras refs
      - name: Node (versão do .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Tag deve bater com a versão do package.json
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "${expected}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} diferente da versão do package.json (${expected})."
            exit 1
          fi

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund

      - name: Lint, tipos, testes e build
        run: npm run ci

      - name: Empacotar dist/
        run: |
          cd dist
          zip -qr "../cronoai-${GITHUB_REF_NAME}-dist.zip" .

      - name: Enviar pacote para o job de publicação
        uses: actions/upload-artifact@v7
        with:
          name: release-zip
          path: cronoai-${{ github.ref_name }}-dist.zip
          retention-days: 1

  publish:
    name: Publicar GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # criar o GitHub Release
    steps:
      - name: Baixar pacote
        uses: actions/download-artifact@v8
        with:
          name: release-zip

      - name: Criar GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "cronoai-${GITHUB_REF_NAME}-dist.zip" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "CronoAI ${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
